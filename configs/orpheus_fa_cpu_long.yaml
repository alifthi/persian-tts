# Orpheus-3B Persian LoRA — OPEN-ENDED continuation of runs/orpheus-fa-cpu.
#
# The first run (orpheus_fa_cpu.yaml) stopped at step 600 while val loss was
# STILL falling (4.9790 -> 4.6341, 10 of 11 evals improving, best val at the
# final step). The schedule ended before learning did, so this config just
# removes the end of the schedule.
#
# Differences from orpheus_fa_cpu.yaml, and why:
#
#  1. max_steps: 100000 — a sentinel, not a target. At the MEASURED CPU rate of
#     ~44 s/optimizer step that is ~51 days; nobody reaches it. The run is meant
#     to be ended with SIGTERM when the user says so, which train_orpheus.py now
#     handles by finishing the step, checkpointing, and exiting cleanly.
#  2. lr_scheduler: constant_with_warmup — cosine needs a known horizon. With an
#     open-ended run a cosine over 100k steps would sit at ~full LR forever
#     anyway, and a constant LR means the adapter you get by stopping at ANY
#     step is a legitimate checkpoint rather than a half-annealed one. Anneal
#     deliberately at the end with a short cosine run if it is worth it.
#  3. learning_rate: 1.0e-4 — half the first run's. The adapter is no longer
#     cold (600 steps in), and a constant LR held for tens of thousands of
#     steps is far more aggressive than a cosine that spends most of its budget
#     decaying.
#  4. eval/save every 100 with keep_last 5 — more frequent than the first run
#     because the stop time is unknown; at most 100 steps (~1.2 h) can be lost
#     to an unclean kill.
#
# It resumes from runs/orpheus-fa-cpu automatically (same output_dir): the
# latest step_* directory supplies adapter, optimizer and step counter, and
# best_val.json carries the 4.6341 bar forward so "NEW BEST" stays meaningful
# across the two runs.

base_model: unsloth/orpheus-3b-0.1-pretrained
snac_model: hubertsiuzdak/snac_24khz
load_in_4bit: false      # bitsandbytes has no CPU kernels
attn_implementation: sdpa

lora_r: 16
lora_alpha: 32
lora_dropout: 0.05

train_manifest: data/processed/orpheus_train.jsonl
val_manifest: data/processed/orpheus_val.jsonl
speakers: [mana]
max_length: 1024
max_audio_tokens: 512

learning_rate: 1.0e-4
lr_scheduler: constant_with_warmup
warmup_steps: 20
max_steps: 100000
batch_size: 1
grad_accum: 4
max_grad_norm: 1.0
precision: fp32          # CPU bf16 autocast is slower than fp32
gradient_checkpointing: true

output_dir: runs/orpheus-fa-cpu
log_every: 10
eval_every: 100
save_every: 100
keep_last: 5

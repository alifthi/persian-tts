# Full-size fine-tune architecture on a tiny subset: validates the pipeline on a 4GB laptop GPU.
name: smoke
out_dir: runs
data:
  root: data/smoke
  train_manifest: data/smoke/train.jsonl
  val_manifest: data/smoke/val.jsonl
  speakers: data/smoke/speakers.json
  max_frames_per_batch: 1200
  max_batch_size: 2
  num_workers: 2
train: {init_from: data/pretrained/persian_init_smoke.pt, freeze_decoder_steps: 20, max_steps: 40, segment_size: 4096,
        log_every: 10, eval_every: 20, save_every: 20, warmup_steps: 10, precision: bf16}
